<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>редактор фото</title>
<style>
  * { box-sizing: border-box; border-radius: 0 !important; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body { background: #E6E6E6; color: #1B1B1F; font-family: Arial, Helvetica, sans-serif; font-size: 14px; min-height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid #1B1B1F; font-size: 18px; }
  main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; flex: 1; }
  #stage { flex: 1 1 360px; min-width: 0; min-height: 320px; display: flex; align-items: center; justify-content: center; border: 1px solid #1B1B1F; padding: 8px; }
  #stage canvas { max-width: 100%; max-height: 75vh; display: block; }
  #panel { flex: 0 0 280px; max-width: 100%; display: flex; flex-direction: column; gap: 12px; }
  fieldset { border: 1px solid #1B1B1F; padding: 10px; }
  legend { padding: 0 4px; font-weight: bold; }
  label.row { display: block; margin-bottom: 8px; }
  label.row span { display: flex; justify-content: space-between; }
  input[type=range] { width: 100%; }
  .btn { display: block; background: #1B1B1F; color: #E6E6E6; border: none; padding: 10px; font-size: 14px; cursor: pointer; width: 100%; text-align: center; }
  .btn-outline { background: #E6E6E6; color: #1B1B1F; border: 1px solid #1B1B1F; }
  .btn:disabled { opacity: .4; cursor: default; }
  #file { display: none; }
  footer { padding: 8px 16px; font-size: 11px; text-align: center; border-top: 1px solid #1B1B1F; }
  footer a { color: #1B1B1F; }
</style>
</head>
<body>
<header>редактор фото</header>

<main>
  <div id="stage">
    <span id="hint">загрузите фото</span>
    <canvas id="view" hidden></canvas>
  </div>

  <div id="panel">
    <label class="btn">
      загрузить фото
      <input type="file" id="file" accept="image/*">
    </label>

    <fieldset>
      <legend>деформация</legend>
      <label class="row"><span>центр по x <b id="cxv"></b></span><input type="range" id="cx" min="0" max="100" value="50"></label>
      <label class="row"><span>центр по y <b id="cyv"></b></span><input type="range" id="cy" min="0" max="100" value="40"></label>
      <label class="row"><span>радиус <b id="radv"></b></span><input type="range" id="rad" min="5" max="90" value="40"></label>
      <label class="row"><span>сдвиг влево/вправо <b id="shxv"></b></span><input type="range" id="shx" min="-100" max="100" value="0"></label>
      <label class="row"><span>сдвиг вверх/вниз <b id="shyv"></b></span><input type="range" id="shy" min="-100" max="100" value="0"></label>
      <label class="row"><span>растянуть по x <b id="stxv"></b></span><input type="range" id="stx" min="-90" max="90" value="0"></label>
      <label class="row"><span>растянуть по y <b id="styv"></b></span><input type="range" id="sty" min="-90" max="90" value="0"></label>
    </fieldset>

    <fieldset>
      <legend>цвет и эффекты</legend>
      <label class="row"><input type="checkbox" id="gray"> ч/б</label>
      <label class="row"><span>контраст <b id="contrastv"></b></span><input type="range" id="contrast" min="-100" max="100" value="0"></label>
      <label class="row"><span>яркость <b id="brightv"></b></span><input type="range" id="bright" min="-100" max="100" value="0"></label>
      <label class="row"><span>порог (0 = выкл) <b id="thrv"></b></span><input type="range" id="thr" min="0" max="255" value="0"></label>
      <label class="row"><span>зерно <b id="grainv"></b></span><input type="range" id="grain" min="0" max="100" value="0"></label>
      <label class="row"><span>крупность зерна <b id="gsizev"></b></span><input type="range" id="gsize" min="1" max="10" value="2"></label>
    </fieldset>

    <button class="btn btn-outline" id="reset" disabled>сбросить</button>
    <button class="btn" id="dl-jpg" disabled>скачать jpg</button>
    <button class="btn" id="dl-png" disabled>скачать png</button>
    <div id="busy" style="min-height:18px"></div>
  </div>
</main>

<footer>автор: <a href="https://t.me/navarotvar">ot.var</a></footer>

<script>
const $ = id => document.getElementById(id);
const PREVIEW_MAX = 1200;
const SLIDERS = ['cx','cy','rad','shx','shy','stx','sty','contrast','bright','thr','grain','gsize'];
const DEFAULTS = {cx:50, cy:40, rad:40, shx:0, shy:0, stx:0, sty:0, contrast:0, bright:0, thr:0, grain:0, gsize:2, gray:false};

let srcCanvas = null;
let prevCanvas = null;
let rafId = 0;

function updateLabels() {
  SLIDERS.forEach(k => $(k + 'v').textContent = $(k).value);
}

function getParams() {
  const p = {};
  SLIDERS.forEach(k => p[k] = +$(k).value);
  p.gray = $('gray').checked;
  return p;
}

function hash(x, y) {
  let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}

function processImage(src, p) {
  const W = src.width, H = src.height;
  const sd = src.getContext('2d').getImageData(0, 0, W, H).data;
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const octx = out.getContext('2d');
  const img = octx.createImageData(W, H);
  const od = img.data;

  const minDim = Math.min(W, H);
  const cx = W * p.cx / 100, cy = H * p.cy / 100;
  const R = minDim * p.rad / 100;
  const shx = minDim * p.shx / 100, shy = minDim * p.shy / 100;
  const bx = p.stx / 100, by = p.sty / 100;
  const warp = p.shx || p.shy || p.stx || p.sty;

  const cf = 259 * (p.contrast * 2.55 + 255) / (255 * (259 - p.contrast * 2.55));
  const br = p.bright * 2.55;
  const bs = Math.max(1, Math.round(p.gsize * W / 1000));
  const gAmp = p.grain * 1.5;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      let sx = x, sy = y;
      if (warp && R > 0) {
        const dx = x - cx, dy = y - cy;
        const d = Math.sqrt(dx * dx + dy * dy) / R;
        if (d < 1) {
          const f = (1 - d) * (1 - d);
          sx = cx + dx * (1 - bx * f) - shx * f;
          sy = cy + dy * (1 - by * f) - shy * f;
        }
      }
      sx = Math.min(Math.max(sx, 0), W - 1);
      sy = Math.min(Math.max(sy, 0), H - 1);

      const x0 = Math.floor(sx), y0 = Math.floor(sy);
      const x1 = Math.min(x0 + 1, W - 1), y1 = Math.min(y0 + 1, H - 1);
      const fx = sx - x0, fy = sy - y0;
      const i00 = (y0 * W + x0) * 4, i10 = (y0 * W + x1) * 4;
      const i01 = (y1 * W + x0) * 4, i11 = (y1 * W + x1) * 4;

      let r = (sd[i00] * (1 - fx) + sd[i10] * fx) * (1 - fy) + (sd[i01] * (1 - fx) + sd[i11] * fx) * fy;
      let g = (sd[i00+1] * (1 - fx) + sd[i10+1] * fx) * (1 - fy) + (sd[i01+1] * (1 - fx) + sd[i11+1] * fx) * fy;
      let b = (sd[i00+2] * (1 - fx) + sd[i10+2] * fx) * (1 - fy) + (sd[i01+2] * (1 - fx) + sd[i11+2] * fx) * fy;

      if (p.gray) {
        const l = 0.299 * r + 0.587 * g + 0.114 * b;
        r = g = b = l;
      }

      if (p.contrast !== 0) {
        r = cf * (r - 128) + 128;
        g = cf * (g - 128) + 128;
        b = cf * (b - 128) + 128;
      }
      r += br; g += br; b += br;

      if (p.thr > 0) {
        const l = 0.299 * r + 0.587 * g + 0.114 * b;
        const v = l >= p.thr ? 255 : 0;
        r = g = b = v;
      }

      if (p.grain > 0) {
        const n = (hash(Math.floor(x / bs), Math.floor(y / bs)) - 0.5) * 2 * gAmp;
        r += n; g += n; b += n;
      }

      const o = (y * W + x) * 4;
      od[o] = r; od[o+1] = g; od[o+2] = b; od[o+3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  return out;
}

function renderPreview() {
  if (!prevCanvas) return;
  const out = processImage(prevCanvas, getParams());
  const view = $('view');
  view.width = out.width;
  view.height = out.height;
  view.getContext('2d').drawImage(out, 0, 0);
}

function schedulePreview() {
  updateLabels();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(renderPreview);
}

function loadFile(file) {
  const img = new Image();
  img.onload = () => {
    srcCanvas = document.createElement('canvas');
    srcCanvas.width = img.naturalWidth;
    srcCanvas.height = img.naturalHeight;
    srcCanvas.getContext('2d').drawImage(img, 0, 0);

    const s = Math.min(1, PREVIEW_MAX / Math.max(img.naturalWidth, img.naturalHeight));
    prevCanvas = document.createElement('canvas');
    prevCanvas.width = Math.round(img.naturalWidth * s);
    prevCanvas.height = Math.round(img.naturalHeight * s);
    prevCanvas.getContext('2d').drawImage(img, 0, 0, prevCanvas.width, prevCanvas.height);

    $('hint').hidden = true;
    $('view').hidden = false;
    ['reset', 'dl-jpg', 'dl-png'].forEach(id => $(id).disabled = false);
    URL.revokeObjectURL(img.src);
    renderPreview();
  };
  img.src = URL.createObjectURL(file);
}

function download(type) {
  if (!srcCanvas) return;
  $('busy').textContent = 'обработка полного размера...';
  setTimeout(() => {
    const out = processImage(srcCanvas, getParams());
    const mime = type === 'png' ? 'image/png' : 'image/jpeg';
    out.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'foto.' + type;
      document.body.appendChild(a);
      a.click();
      a.remove();
      $('busy').textContent = '';
    }, mime, 0.95);
  }, 30);
}

function resetAll() {
  SLIDERS.forEach(k => $(k).value = DEFAULTS[k]);
  $('gray').checked = DEFAULTS.gray;
  schedulePreview();
}

$('file').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
SLIDERS.forEach(k => $(k).addEventListener('input', schedulePreview));
$('gray').addEventListener('change', schedulePreview);
$('reset').addEventListener('click', resetAll);
$('dl-jpg').addEventListener('click', () => download('jpg'));
$('dl-png').addEventListener('click', () => download('png'));

updateLabels();
</script>
</body>
</html>
